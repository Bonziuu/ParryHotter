name: Python installer tests
on:
  push:
  pull_request:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Python, portable C++ and generated asset checks
        if: runner.os == 'Linux'
        run: python -m tools.check
      - name: Run Windows Python and generated asset checks
        if: runner.os == 'Windows'
        run: python -m tools.check --python-only

  unified-pl-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and verify real Unified-PL with Parry Hotter
        run: python -m tools.verify_download

  daedalus-compile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Gothic 1 Unified-PL plus Parry Hotter using pinned GDC
        run: python -m tools.verify_daedalus
