name: Experimental Gothic I Union HUD plugin
on:
  push:
    paths:
      - 'union/**'
      - 'tools/generate_hud_textures.py'
      - 'tools/spell_catalog.py'
      - 'tools/check.py'
      - '.github/workflows/union-hud.yml'
  pull_request:
    paths:
      - 'union/**'
      - 'tools/generate_hud_textures.py'
      - 'tools/spell_catalog.py'
      - 'tools/check.py'
      - '.github/workflows/union-hud.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  state-and-sprites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Discover and run every portable C++ test and validate all HUD textures
        run: python -m tools.check --cpp-only

  build-g1-union:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Fetch pinned Gothic I Union SDK and stage all plugin headers
        shell: pwsh
        run: |
          $sdkCommit = '4ae1fc51bd962e72ed2a0b1d3da92084517db996'
          git init sdk
          if ($LASTEXITCODE -ne 0) { throw 'SDK init failed' }
          git -C sdk remote add origin https://github.com/Gratt-5r2/UnionProject.git
          git -C sdk fetch --depth 1 origin $sdkCommit
          if ($LASTEXITCODE -ne 0) { throw 'Pinned SDK fetch failed' }
          git -C sdk checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Pinned SDK checkout failed' }
          if ((git -C sdk rev-parse HEAD) -ne $sdkCommit) { throw 'SDK commit mismatch' }
          Copy-Item 'union/Plugin/plugin.cpp' 'sdk/UnionProject/Plugin/plugin.cpp' -Force
          Copy-Item 'union/hud/*.hpp' 'sdk/UnionProject/Plugin/' -Force
          Copy-Item 'union/Plugin/*.hpp' 'sdk/UnionProject/Plugin/' -Force
          Copy-Item 'union/userapi/*.inl' 'sdk/UnionProject/GothicAPI/Gothic_UserAPI/' -Force
      - name: Build native G1 Release / Win32 DLL
        shell: pwsh
        env:
          CL: /std:c++17
        run: |
          msbuild 'sdk/UnionProject/UnionProject.vcxproj' /m /p:Configuration="G1 Release" /p:Platform=Win32 /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'Native G1 DLL build failed' }
      - name: Show built DLL candidates
        shell: pwsh
        run: |
          Get-ChildItem sdk -Filter '*.dll' -Recurse | ForEach-Object { Write-Host $_.FullName }
      - name: Preserve DLL as a private test artifact (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: ParryHotter-Union-G1-EXPERIMENTAL
          path: sdk/UnionProject/G1 Release/UnionProject.dll
          if-no-files-found: error
      - name: Prepare clearly labeled experimental G1 DLL
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'prerelease' -Force | Out-Null
          Copy-Item 'sdk/UnionProject/G1 Release/UnionProject.dll' 'prerelease/ParryHotterHUD-G1.dll' -Force
      - name: Publish experimental HUD DLL for one-click local test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hud-dev
          name: 'Parry Hotter - HUD EXPERIMENTAL (Gothic 1)'
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            Gothic I Union DLL for private TESTING ONLY.
            Not verified in Gothic engine. May need adjustment for particular
            Steam builds and installed Union patches. Do not use with production
            save games. See union/README.md for safe backup/testing.
            Source code and HUD sprites are in this repository.
          files: prerelease/ParryHotterHUD-G1.dll
          fail_on_unmatched_files: true
