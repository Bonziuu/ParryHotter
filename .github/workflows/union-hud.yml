name: Experimental Gothic I Union HUD plugin
on:
  push:
    paths:
      - 'union/**'
      - 'tools/generate_hud_textures.py'
      - 'tools/spell_catalog.py'
      - 'tools/check.py'
      - 'tools/build_union.ps1'
      - 'tools/verify_dll.py'
      - '.github/workflows/union-hud.yml'
  pull_request:
    paths:
      - 'union/**'
      - 'tools/generate_hud_textures.py'
      - 'tools/spell_catalog.py'
      - 'tools/check.py'
      - 'tools/build_union.ps1'
      - 'tools/verify_dll.py'
      - '.github/workflows/union-hud.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  state-and-sprites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Discover and run every portable C++ test and validate all HUD textures
        run: python -m tools.check --cpp-only

  build-g1-union:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build native G1 Release / Win32 DLL with the local build script
        shell: pwsh
        # Exactly the command documented for players; it pins the SDK commit,
        # stages every header and .inl, and rejects a DLL without the marker.
        run: powershell -ExecutionPolicy Bypass -File tools/build_union.ps1
      - name: Verify PE32 i386 DLL, build marker and imported DLLs
        shell: pwsh
        run: |
          python -m tools.verify_dll .parryhotter/build/ParryHotterHUD-G1.dll
          if ($LASTEXITCODE -ne 0) { throw 'Built DLL failed verification' }
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Hostx64\\x86' } | Select-Object -First 1
          if ($dumpbin) { & $dumpbin.FullName /nologo /headers /dependents .parryhotter/build/ParryHotterHUD-G1.dll | Select-String 'machine|DLL|\.dll' }
      - name: Preserve DLL as a private test artifact (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: ParryHotter-Union-G1-EXPERIMENTAL
          path: .parryhotter/build/ParryHotterHUD-G1.dll
          if-no-files-found: error
      - name: Prepare DEV 0.13 branch build for remote installation
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/dev013-handoff'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'dev013' -Force | Out-Null
          Copy-Item '.parryhotter/build/ParryHotterHUD-G1.dll' 'dev013/ParryHotterHUD-G1.dll' -Force
          $hash = (Get-FileHash 'dev013/ParryHotterHUD-G1.dll' -Algorithm SHA256).Hash.ToLower()
          "$hash  ParryHotterHUD-G1.dll" | Set-Content -NoNewline -Encoding ascii 'dev013/ParryHotterHUD-G1.dll.sha256'
      - name: Publish DEV 0.13 branch build (verified PE32 i386, test only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/dev013-handoff'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev013-latest
          target_commitish: ${{ github.sha }}
          name: 'Parry Hotter DEV 0.13 - latest branch build (TEST ONLY)'
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            Latest DLL built by MSVC from codex/dev013-handoff, commit ${{ github.sha }}.
            Verified by tools/verify_dll.py (PE32 i386, PH_BUILD_013 marker).
            For private testing in Gothic I with Union only; install through
            the project's .parryhotter/build and ZBUDUJ_MOD_PO_REPARSE.bat.
          files: |
            dev013/ParryHotterHUD-G1.dll
            dev013/ParryHotterHUD-G1.dll.sha256
          fail_on_unmatched_files: true
      - name: Prepare clearly labeled experimental G1 DLL
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'prerelease' -Force | Out-Null
          Copy-Item '.parryhotter/build/ParryHotterHUD-G1.dll' 'prerelease/ParryHotterHUD-G1.dll' -Force
      - name: Publish experimental HUD DLL for one-click local test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hud-dev
          name: 'Parry Hotter - HUD EXPERIMENTAL (Gothic 1)'
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            Gothic I Union DLL for private TESTING ONLY.
            Not verified in Gothic engine. May need adjustment for particular
            Steam builds and installed Union patches. Do not use with production
            save games. See union/README.md for safe backup/testing.
            Source code and HUD sprites are in this repository.
          files: prerelease/ParryHotterHUD-G1.dll
          fail_on_unmatched_files: true
